<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAISE</title>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
  <style>
    body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
}
.app {
  max-width: 500px;
  margin: 0 auto;
  padding: 24px;
}
.add-task {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.add-task input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: none;
}
.add-task button {
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  background: #e25822;
  color: #fff;
  font-weight: bold;
}
.item-list {
  list-style: none;
  padding: 0;
}
.item-list li {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item-list li.done span {
  text-decoration: line-through;
  color: #888;
}
.delete-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 1.2rem;
  cursor: pointer;
}
h2 {
  font-size: 1.1rem;
  margin-top: 32px;
  color: #e25822;
}
.add-note {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
}
.add-note textarea {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
}
.add-note button {
  align-self: flex-start;
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  background: #e25822;
  color: #fff;
  font-weight: bold;
}
.note-card {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 8px;
}
.note-card p {
  margin: 0 0 8px 0;
  white-space: pre-wrap;
}
.note-date {
  font-size: 0.75rem;
  color: #888;
  margin-bottom: 8px;
}
.add-project {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
}
.add-project input,
.add-project textarea {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-family: inherit;
}
.add-project textarea {
  resize: vertical;
  min-height: 50px;
}
.add-project button {
  align-self: flex-start;
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  background: #e25822;
  color: #fff;
  font-weight: bold;
}
.project-card {
  background: #1e1e1e;
  padding: 14px;
  border-radius: 6px;
  margin-bottom: 8px;
  border-left: 3px solid #e25822;
}
.project-card h3 {
  margin: 0 0 6px 0;
  font-size: 1.05rem;
}
.project-card p {
  margin: 0 0 8px 0;
  font-style: italic;
  color: #bbb;
  white-space: pre-wrap;
}
#routine-summary {
  color: #888;
  font-size: 0.9rem;
  margin: -8px 0 12px 0;
}
.app {
  padding-bottom: 90px; /* laisse de la place pour la barre du bas */
}
.page {
  display: none;
}
.page.active {
  display: block;
}
#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: #1a1a1a;
  border-top: 1px solid #333;
  padding-bottom: env(safe-area-inset-bottom); /* évite la barre d'accueil iPhone */
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 10px 0;
  background: none;
  border: none;
  color: #888;
  font-family: inherit;
}
.nav-btn.active {
  color: #e25822;
}
.nav-icon {
  font-size: 1.4rem;
}
.nav-label {
  font-size: 0.7rem;
}
  </style>
</head>
<body>
<div class="app">
  <h1>BRAISE</h1>

  <div id="page-routine" class="page active">
    <h2>Routine quotidienne</h2>
    <p id="routine-summary"></p>
    <div class="add-task">
      <input type="text" id="new-routine" placeholder="Nouvelle habitude...">
      <button id="add-routine-btn">Ajouter</button>
    </div>
    <ul id="routine-list" class="item-list"></ul>
  </div>

  <div id="page-rest" class="page">
    <h2>Tâches</h2>
    <div class="add-task">
      <input type="text" id="new-task" placeholder="Nouvelle tâche...">
      <button id="add-btn">Ajouter</button>
    </div>
    <ul id="task-list" class="item-list"></ul>

    <h2>Notes en vrac</h2>
    <div class="add-note">
      <textarea id="new-note" placeholder="Écris une idée, un truc à ne pas oublier..."></textarea>
      <button id="add-note-btn">Ajouter</button>
    </div>
    <div id="notes-list"></div>

    <h2>Mes projets</h2>
    <div class="add-project">
      <input type="text" id="new-project-title" placeholder="Nom du projet...">
      <textarea id="new-project-why" placeholder="Pourquoi tu veux atteindre cet objectif ?"></textarea>
      <button id="add-project-btn">Ajouter</button>
    </div>
    <div id="projects-list"></div>
  </div>
</div>

<nav id="bottom-nav">
  <button class="nav-btn active" data-page="page-routine">
    <span class="nav-icon">🔥</span>
    <span class="nav-label">Routine</span>
  </button>
  <button class="nav-btn" data-page="page-rest">
    <span class="nav-icon">📋</span>
    <span class="nav-label">Le reste</span>
  </button>
</nav>

<script>
  const input = document.getElementById('new-task');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');

  let tasks = [];

  function loadTasks() {
    const saved = localStorage.getItem('braise-tasks');
    tasks = saved ? JSON.parse(saved) : [];
  }

  function saveTasks() {
    localStorage.setItem('braise-tasks', JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = '';
    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';

      const span = document.createElement('span');
      span.textContent = task.text;
      span.addEventListener('click', () => toggleTask(task.id));

      const delBtn = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  function addTask() {
    const text = input.value.trim();
    if (text === '') return;
    tasks.push({ id: Date.now(), text: text, done: false });
    saveTasks();
    render();
    input.value = '';
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    task.done = !task.done;
    saveTasks();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  loadTasks();
  render();

    // --- Routine quotidienne ---
  const routineInput = document.getElementById('new-routine');
  const addRoutineBtn = document.getElementById('add-routine-btn');
  const routineList = document.getElementById('routine-list');

  let routine = [];

  function todayString() {
    return new Date().toISOString().slice(0, 10); // ex: "2026-09-08"
  }

  function loadRoutine() {
    const saved = localStorage.getItem('braise-routine');
    routine = saved ? JSON.parse(saved) : [];

    const lastDate = localStorage.getItem('braise-routine-date');
    if (lastDate !== todayString()) {
      routine.forEach(item => item.done = false);
      localStorage.setItem('braise-routine-date', todayString());
      saveRoutine();
    }
  }

  function saveRoutine() {
    localStorage.setItem('braise-routine', JSON.stringify(routine));
  }

  function renderRoutine() {
    routineList.innerHTML = '';
      const doneCount = routine.filter(item => item.done).length;
  document.getElementById('routine-summary').textContent = `${doneCount}/${routine.length} faites`;
    routine.forEach(item => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';

      const span = document.createElement('span');
      span.textContent = item.text;
      span.addEventListener('click', () => toggleRoutineItem(item.id));

      const delBtn = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteRoutineItem(item.id));

      li.appendChild(span);
      li.appendChild(delBtn);
      routineList.appendChild(li);
    });
  }

  function addRoutineItem() {
    const text = routineInput.value.trim();
    if (text === '') return;
    routine.push({ id: Date.now(), text: text, done: false });
    saveRoutine();
    renderRoutine();
    routineInput.value = '';
  }

  function toggleRoutineItem(id) {
    const item = routine.find(r => r.id === id);
    item.done = !item.done;
    saveRoutine();
    renderRoutine();
  }

  function deleteRoutineItem(id) {
    routine = routine.filter(r => r.id !== id);
    saveRoutine();
    renderRoutine();
  }

  addRoutineBtn.addEventListener('click', addRoutineItem);
  routineInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addRoutineItem();
  });

  loadRoutine();
  renderRoutine();

    // --- Notes en vrac ---
  const noteInput = document.getElementById('new-note');
  const addNoteBtn = document.getElementById('add-note-btn');
  const notesList = document.getElementById('notes-list');

  let notes = [];

  function loadNotes() {
    const saved = localStorage.getItem('braise-notes');
    notes = saved ? JSON.parse(saved) : [];
  }

  function saveNotes() {
    localStorage.setItem('braise-notes', JSON.stringify(notes));
  }

  function renderNotes() {
    notesList.innerHTML = '';
    [...notes].reverse().forEach(note => {
      const card = document.createElement('div');
      card.className = 'note-card';

      const p = document.createElement('p');
      p.textContent = note.text;

      const date = document.createElement('div');
      date.className = 'note-date';
      date.textContent = new Date(note.id).toLocaleString('fr-CH');

      const delBtn = document.createElement('button');
      delBtn.textContent = '× Supprimer';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteNote(note.id));

      card.appendChild(date);
      card.appendChild(p);
      card.appendChild(delBtn);
      notesList.appendChild(card);
    });
  }

  function addNote() {
    const text = noteInput.value.trim();
    if (text === '') return;
    notes.push({ id: Date.now(), text: text });
    saveNotes();
    renderNotes();
    noteInput.value = '';
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    saveNotes();
    renderNotes();
  }

  addNoteBtn.addEventListener('click', addNote);

  loadNotes();
  renderNotes();

    // --- Mes projets ---
  const projectTitleInput = document.getElementById('new-project-title');
  const projectWhyInput = document.getElementById('new-project-why');
  const addProjectBtn = document.getElementById('add-project-btn');
  const projectsList = document.getElementById('projects-list');

  let projects = [];

  function loadProjects() {
    const saved = localStorage.getItem('braise-projects');
    projects = saved ? JSON.parse(saved) : [];
  }

  function saveProjects() {
    localStorage.setItem('braise-projects', JSON.stringify(projects));
  }

  function renderProjects() {
    projectsList.innerHTML = '';
    projects.forEach(project => {
      const card = document.createElement('div');
      card.className = 'project-card';

      const h3 = document.createElement('h3');
      h3.textContent = project.title;

      const p = document.createElement('p');
      p.textContent = project.why;

      const delBtn = document.createElement('button');
      delBtn.textContent = '× Supprimer';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteProject(project.id));

      card.appendChild(h3);
      card.appendChild(p);
      card.appendChild(delBtn);
      projectsList.appendChild(card);
    });
  }

  function addProject() {
    const title = projectTitleInput.value.trim();
    const why = projectWhyInput.value.trim();
    if (title === '') return;

    projects.push({ id: Date.now(), title: title, why: why });
    saveProjects();
    renderProjects();
    projectTitleInput.value = '';
    projectWhyInput.value = '';
  }

  function deleteProject(id) {
    projects = projects.filter(p => p.id !== id);
    saveProjects();
    renderProjects();
  }

  addProjectBtn.addEventListener('click', addProject);

  loadProjects();
  renderProjects();

  if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Service worker enregistré'))
    .catch((err) => console.error('Erreur service worker', err));
}

  // --- Navigation par onglets ---
  const navButtons = document.querySelectorAll('.nav-btn');
  const pages = document.querySelectorAll('.page');

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.page;
      pages.forEach(page => page.classList.toggle('active', page.id === targetId));
      navButtons.forEach(b => b.classList.toggle('active', b === btn));
    });
  });
</script>
</body>
</html>
