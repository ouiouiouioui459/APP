<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAISE</title>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
  <style>
    body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
}
.app {
  max-width: 500px;
  margin: 0 auto;
  padding: 24px;
}
.add-task {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.add-task input {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: none;
}
.add-task button {
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  background: #e25822;
  color: #fff;
  font-weight: bold;
}
.item-list {
  list-style: none;
  padding: 0;
}
.item-list li {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item-list li.done span {
  text-decoration: line-through;
  color: #888;
}
.delete-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 1.2rem;
  cursor: pointer;
}
h2 {
  font-size: 1.1rem;
  margin-top: 32px;
  color: #e25822;
}
  </style>
</head>
<body>
    <div class="app">
  <h1>BRAISE</h1>

  <div class="add-task">
    <input type="text" id="new-task" placeholder="Nouvelle tâche...">
    <button id="add-btn">Ajouter</button>
  </div>

<ul id="task-list" class="item-list"></ul>

    <h2>Routine quotidienne</h2>
  <div class="add-task">
    <input type="text" id="new-routine" placeholder="Nouvelle habitude...">
    <button id="add-routine-btn">Ajouter</button>
  </div>
  <ul id="routine-list" class="item-list"></ul>
</div>

<script>
  const input = document.getElementById('new-task');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');

  let tasks = [];

  function loadTasks() {
    const saved = localStorage.getItem('braise-tasks');
    tasks = saved ? JSON.parse(saved) : [];
  }

  function saveTasks() {
    localStorage.setItem('braise-tasks', JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = '';
    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';

      const span = document.createElement('span');
      span.textContent = task.text;
      span.addEventListener('click', () => toggleTask(task.id));

      const delBtn = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  function addTask() {
    const text = input.value.trim();
    if (text === '') return;
    tasks.push({ id: Date.now(), text: text, done: false });
    saveTasks();
    render();
    input.value = '';
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    task.done = !task.done;
    saveTasks();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  loadTasks();
  render();

    // --- Routine quotidienne ---
  const routineInput = document.getElementById('new-routine');
  const addRoutineBtn = document.getElementById('add-routine-btn');
  const routineList = document.getElementById('routine-list');

  let routine = [];

  function todayString() {
    return new Date().toISOString().slice(0, 10); // ex: "2026-09-08"
  }

  function loadRoutine() {
    const saved = localStorage.getItem('braise-routine');
    routine = saved ? JSON.parse(saved) : [];

    const lastDate = localStorage.getItem('braise-routine-date');
    if (lastDate !== todayString()) {
      routine.forEach(item => item.done = false);
      localStorage.setItem('braise-routine-date', todayString());
      saveRoutine();
    }
  }

  function saveRoutine() {
    localStorage.setItem('braise-routine', JSON.stringify(routine));
  }

  function renderRoutine() {
    routineList.innerHTML = '';
    routine.forEach(item => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';

      const span = document.createElement('span');
      span.textContent = item.text;
      span.addEventListener('click', () => toggleRoutineItem(item.id));

      const delBtn = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.className = 'delete-btn';
      delBtn.addEventListener('click', () => deleteRoutineItem(item.id));

      li.appendChild(span);
      li.appendChild(delBtn);
      routineList.appendChild(li);
    });
  }

  function addRoutineItem() {
    const text = routineInput.value.trim();
    if (text === '') return;
    routine.push({ id: Date.now(), text: text, done: false });
    saveRoutine();
    renderRoutine();
    routineInput.value = '';
  }

  function toggleRoutineItem(id) {
    const item = routine.find(r => r.id === id);
    item.done = !item.done;
    saveRoutine();
    renderRoutine();
  }

  function deleteRoutineItem(id) {
    routine = routine.filter(r => r.id !== id);
    saveRoutine();
    renderRoutine();
  }

  addRoutineBtn.addEventListener('click', addRoutineItem);
  routineInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addRoutineItem();
  });

  loadRoutine();
  renderRoutine();
</script>
</body>
</html>
